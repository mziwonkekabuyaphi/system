<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>QLess · Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* Structural/theme vars only. --accent/--accent-2 are set at runtime from
       tenant_branding — nothing tenant-specific is hardcoded here. */
    :root {
      --bg: #09090b;
      --surface: #111114;
      --surface-2: #18181c;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-dim: #52525b;
      --sb-w: 220px;
      --accent: #6366f1;   /* overridden per-tenant at runtime */
      --accent-2: #4f46e5; /* overridden per-tenant at runtime */
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; }

    /* Loading screen */
    .loading-screen { position: fixed; inset: 0; z-index: 999; background: var(--bg); display: flex; align-items: center; justify-content: center; transition: opacity .4s var(--ease); }
    .loading-screen.hidden { opacity: 0; pointer-events: none; }
    .loading-screen i { font-size: 1.6rem; color: var(--accent); animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Shell layout */
    .shell { display: flex; height: 100%; }

    .sidebar { width: var(--sb-w); flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sb-header { display: flex; align-items: center; gap: 10px; padding: 16px; border-bottom: 1px solid var(--border); min-height: 64px; }
    .sb-logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
    .sb-logo img { width: 100%; height: 100%; object-fit: cover; }
    .sb-logo i { color: white; font-size: 1rem; }
    .sb-brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .sb-nav { flex: 1; overflow-y: auto; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; background: transparent; border: none; color: var(--text-muted); font-family: inherit; font-size: 0.85rem; text-align: left; cursor: pointer; transition: background .15s var(--ease), color .15s var(--ease); }
    .nav-item i { width: 16px; text-align: center; }
    .nav-item:hover { background: var(--surface-2); color: var(--text); }
    .nav-item.active { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--text); }
    .nav-empty { padding: 12px 10px; font-size: 0.75rem; color: var(--text-dim); }

    .sb-footer { border-top: 1px solid var(--border); padding: 12px; }
    .sb-user { font-size: 0.72rem; color: var(--text-dim); margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sb-user strong { color: var(--text-muted); display: block; font-weight: 600; }
    .logout-btn { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-family: inherit; font-size: 0.78rem; cursor: pointer; transition: border-color .15s var(--ease), color .15s var(--ease); }
    .logout-btn:hover { border-color: var(--accent); color: var(--text); }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar { height: 56px; flex-shrink: 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; }
    .topbar h1 { font-size: 0.95rem; font-weight: 600; }

    .content { flex: 1; position: relative; overflow: auto; }
    .overview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; padding: 24px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 8px; }
    .stat-value { font-family: 'Space Grotesk', sans-serif; font-size: 1.4rem; font-weight: 700; }

    .module-frame-wrap { position: absolute; inset: 0; }
    .module-iframe { width: 100%; height: 100%; border: none; background: var(--bg); }
    .module-placeholder { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-dim); text-align: center; padding: 24px; }
    .module-placeholder i { font-size: 1.8rem; }
    .module-placeholder p { max-width: 320px; font-size: 0.85rem; }

    .perf-log { font-size: 0.62rem; color: var(--text-dim); padding: 6px 20px; border-top: 1px solid var(--border); white-space: nowrap; overflow-x: auto; }
  </style>
</head>
<body>

  <div class="loading-screen" id="loadingScreen">
    <i class="fa-solid fa-circle-notch"></i>
  </div>

  <div class="shell">
    <aside class="sidebar">
      <div class="sb-header">
        <div class="sb-logo">
          <img id="brandLogo" alt="" style="display:none" />
          <i id="brandLogoFallback" class="fa-solid fa-bolt"></i>
        </div>
        <div class="sb-brand-name" id="brandName">QLess Admin</div>
      </div>

      <nav class="sb-nav" id="sidebarNav"><!-- rendered from AdminContext.enabledModules --></nav>

      <div class="sb-footer">
        <div class="sb-user">
          <strong id="userRole">—</strong>
          <span id="userEmail">—</span>
        </div>
        <button class="logout-btn" id="logoutBtn">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <h1 id="sectionTitle">Overview</h1>
      </div>

      <div class="content">
        <div id="overviewPanel"><!-- rendered from AdminContext --></div>
        <div id="moduleFrames"><!-- lazy-mounted module iframes, kept alive --></div>
      </div>

      <div class="perf-log" id="perfLog"></div>
    </main>
  </div>

  <script type="module" src="../assets/js/admin-shell.js"></script>
</body>
</html>
